# API + Web only — connect to existing MySQL (default: host tms-mysql :3310)
#
#   docker compose -f docker-compose.external-mysql.yml up -d --build
#
# Env overrides: MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD

name: price_boss_ext

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: price-boss-api
    ports:
      - "${PRICE_BOSS_API_PORT:-3850}:3850"
    environment:
      API_PORT: 3850
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3310}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartgift}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rootpass}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3850/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: price-boss-web
    ports:
      - "${PRICE_BOSS_WEB_PORT:-5180}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
