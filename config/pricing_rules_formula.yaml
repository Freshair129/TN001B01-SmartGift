version: "2026.09.11-v3"
contract_reference: "smartgift://b2b/pricing-rules-formula/v1"
last_updated: "2026-09-10T00:00:00+07:00"
updated_by: "zuri_ai_pricing_control_plane"

# v2 (2026-09-10) — additive only, ไม่มีตัวเลขเดิมถูกแก้ค่า
# เพิ่มบล็อกที่เอนจินต้องใช้แต่ไฟล์นี้ยังไม่มี เพื่อให้ pricing engine อ่านจากที่นี่แทน hardcode:
#   standard_quote_profile · logo_methods · logo_positions_rule · lead_time_working_days
#   price_rounding · profit_floors (รูปแบบมีขอบเขตจำนวน) · sources
# ค่าที่เพิ่มถอดมาจากเอนจินที่ใช้งานอยู่ตามสภาพ ไม่ใช่การอนุมัติราคาใหม่ — ดู sources: ท้ายไฟล์
tenant_id: "Org-EtohGroup"
business_id: "SmartGift"
vault_id: "vlt-catalog-product"

currency_exchange_rates:
  cny_to_thb: 5.00
  usd_to_thb: 32.50

logistics_density_and_freight:
  density_threshold_kg_per_cbm: 400.0
  min_chargeable_cbm: 0.01
  sea_threshold_cbm: 5.0
  seasonality_peak_months: [9, 10, 11, 12, 1]
  auto_force_truck_in_peak: true
  inland_china_freight:
    # โรงงาน → โกดังผู้รวบรวมในจีน ก่อนค่าขนส่งจีน–ไทยที่คิดจาก shipping_rate_matrix
    # เอนจินคิดราคาปัจจุบันใช้ฐาน per_set เท่านั้น สูตร CBM ด้านล่างยังไม่ถูก implement ที่ใด
    implemented_basis: "per_set"
    default_rate_cny_per_set: 2.0
    rate_cny_per_cbm: 150.0
    min_charge_cny: 50.0

price_rounding:
  ladder_price_step_thb: 10.0

profit_floors_thb:
  small_order_floor: 5000.0
  standard_floor: 3000.0

# รูปแบบเดียวกับ profit_floors_thb แต่ระบุขอบเขตจำนวนที่เอนจินใช้จริง
profit_floors:
  - max_qty: 20
    thb: 5000.0
  - max_qty: .inf
    thb: 3000.0

# v3 (2026-09-11) — พื้นกำไรเสริม แยกตามชนิดสินค้า สั่งการโดย Boss
# เป็นการ "เสริม" ไม่ใช่แทนที่ profit_floors ด้านบน:
#   effective_floor_thb = max( profit_floors ตามช่วงจำนวน , profit_floors_by_kind ที่เข้าเงื่อนไข )
# หน่วยเป็น "กำไรขั้นต้นรวมทั้งออเดอร์" เหมือน profit_floors เดิม ไม่ใช่ต่อหน่วย
#   กำไรขั้นต้น = (ราคาขาย - total_landed_cost_thb) x จำนวน
# ตัวอย่าง: เซ็ต 100 ชุด -> max(3000, 20000) = 20000 ; เซ็ต 50 ชุด -> max(3000, -) = 3000
profit_floors_by_kind:
  set:
    - min_qty: 100
      thb: 20000.0
  single:
    - min_qty: 50
      thb: 3000.0

small_order_factors:
  - max_qty: 20
    sof: 1.5
  - max_qty: 50
    sof: 1.4
  - max_qty: 100
    sof: 1.3
  - max_qty: 300
    sof: 1.2
  - max_qty: 499
    sof: 1.1
  - max_qty: .inf
    sof: 1.0

markup_bands_standard:
  - max_cost_thb: 250.0
    markup_multiplier: 3.00
  - max_cost_thb: 350.0
    markup_multiplier: 2.73
  - max_cost_thb: 500.0
    markup_multiplier: 2.62
  - max_cost_thb: 650.0
    markup_multiplier: 2.45
  - max_cost_thb: .inf
    markup_multiplier: 2.14

standard_quote_profile:
  name: "ทั่วไป"
  basis: "factory"          # คิด markup บนต้นทุนโรงงานที่ anchor ไม่รวมค่าขนส่ง
  anchor_qty: 500
  breaks: [10, 20, 50, 100, 300, 500, 1000]
  factors: [1.00, 0.90, 0.85, 0.80, 0.77, 0.75, 0.73]
  markup_source: "markup_bands_standard"
  note: "บริษัทเล็ก · freelance ตัวแทนประกัน · นายหน้า"

corporate_quote_profile:
  name: "องค์กร"
  basis: "landed"           # คิด markup บนต้นทุนถึงมือที่ anchor
  flat_markup: 1.47
  anchor_qty: 1000
  breaks: [100, 300, 500, 1000]
  factors: [0.80, 0.77, 0.75, 0.73]
  reference_goods_type: "electronic_tisi"   # คิดค่าขนส่งฐาน markup ด้วยเรท มอก. เสมอ
  note: "รัฐวิสาหกิจ · กสทช. · ไทยคม"
  package_profit_guardrails:
    # ⚠ ไม่ตรงกับ TDD-SEASONAL-PKG-PROFIT-GATE-EXPO-2026-08-30 ที่กำหนด ฿25,000
    #   และเกณฑ์นี้ยังไม่ถูกใช้ในเอนจินคิดราคา — รอการตัดสินใจก่อนแก้ตัวเลข
    min_package_profit_thb: 20000.0
    target_package_profit_thb: 30000.0

# ค่าสกรีนโลโก้ — ถอดจากเอนจินที่ใช้อยู่ (price-boss/pricing.html · pricing_calculator.py)
# ทุกวิธียกเว้น flat คิดเป็น USD แล้วคูณ currency_exchange_rates.usd_to_thb
logo_methods:
  flat:
    unit: "thb_per_position_per_piece"
    default_rate_thb: 10.0
  hotstamp:
    unit: "usd_per_position"
    setup_usd: 11.30
    per_piece_over_100_usd:
      - { max_qty: 100, usd: 0.0 }
      - { max_qty: 499, usd: 0.081 }
      - { max_qty: 999, usd: 0.065 }
      - { max_qty: .inf, usd: 0.048 }
  hotstamp_text:
    unit: "usd_per_position"
    flat_usd: 4.84
  engrave:
    unit: "usd_per_piece_per_position"
    per_piece_usd:
      - { max_qty: 9, usd: 0.17 }
      - { max_qty: 99, usd: 0.081 }
      - { max_qty: 299, usd: 0.05 }
      - { max_qty: 499, usd: 0.035 }
      - { max_qty: .inf, usd: 0.02 }
  silk:
    unit: "usd_per_position_per_color"
    flat_usd_up_to_qty: 350
    flat_usd: 13.0
    per_piece_usd_above: 0.04
  uv:
    unit: "usd_per_piece_per_position"
    per_piece_usd: null       # แคตตาล็อกไม่ประกาศเรท ให้สอบถามฝ่ายขาย
  none:
    unit: "none"

logo_positions_rule:
  pieces_from_code_last_digit: true
  extra_positions: 2          # กล่องของขวัญ + ถุง
  min_positions: 1

lead_time_working_days:
  artwork_confirm: { min: 2, max: 2 }
  sample: { min: 3, max: 5 }        # ข้ามเมื่อเป็นงานเร่ง
  production:
    - { max_qty: 500, min: 7, max: 7 }
    - { max_qty: .inf, min: 15, max: 15 }
  freight:
    truck: { min: 7, max: 10 }
    sea: { min: 21, max: 30 }

srp_benchmark_rules:
  srp_adder_thb: 1530.0
  median_category_margin_percent: 38.0
  moq_breaks: [10, 20, 50, 100, 300, 500, 1000]

