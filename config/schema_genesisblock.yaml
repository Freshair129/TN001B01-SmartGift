# ============================================================================
# SmartGift B2B E-commerce & GraphRAG Schema Specification
# GenesisBlockDB Hybrid Graph + Vector Engine Contract (Version 1.0.0)
# ============================================================================

client_contract:
  client_namespace: "smartgift"
  schema_ref: "smartgift://b2b/portfolio/v1"
  schema_version: "1.3.0"
  vault_isolation: true
  vault_id_format: "UUIDv7 / vlt-{tenant_code}"
  vault_scope: "Product Catalog & Sensory Knowledge Only (Zero PII / Zero Transaction Storage)"
  description: "B2B Gift Sets, Corporate Bundles, Unboxing Sensory Vectors & Product-Only Vault Isolation"

# 1. Vector Spaces Configuration (HNSW In-Process)
vector_spaces:
  - name: "unboxing_sensory"
    model: "bge-m3"
    dim: 1024
    metric: "cosine"
    quantization: "F16"
    purpose: "Sensory descriptions, unboxing feelings, aromas, material textures"

  - name: "product_features"
    model: "bge-m3"
    dim: 1024
    metric: "cosine"
    quantization: "F16"
    purpose: "Technical specifications, charging systems, material grades"

# 2. Node Ontology & Taxonomy
node_ontology:
  Category:
    prefix: "cat:"
    labels: ["Category"]
    properties:
      name_th: { type: "string", required: true }
      name_en: { type: "string", required: true }
      slug: { type: "enum", values: ["eco-friendly", "classic-oriental", "novelty-self-care", "executive-smart-tech"], required: true }
      vibe: { type: "string" }
      target_recipient: { type: "string" }
      guardrail: { type: "string" }

  ProductMaster:
    prefix: "pm:"
    labels: ["ProductMaster"]
    properties:
      code: { type: "string", unique: true, required: true }
      name_th: { type: "string", required: true }
      name_en: { type: "string", required: true }
      category: { type: "string", required: true }
      base_cost: { type: "number", required: true }
      specs: { type: "map" }

  SKU:
    prefix: "sku:"
    labels: ["SKU", "ProductVariant"]
    properties:
      code: { type: "string", unique: true, required: true }
      color: { type: "string" }
      material: { type: "string" }
      inventory_qty: { type: "integer", default: 0 }
      safety_stock: { type: "integer", default: 10 }

  CatalogOffer:
    prefix: "offer:"
    labels: ["CatalogOffer"]
    vector_space: "unboxing_sensory"
    properties:
      code: { type: "string", unique: true, required: true }
      name: { type: "string", required: true }
      gift_tier: { type: "enum", values: ["Reach", "Select", "Signature", "Bespoke"] }
      unboxing_experience: { type: "string", required: true }
      base_price: { type: "number" }
      price_tiers: { type: "list<price_tier>" }

  BundleOffer:
    prefix: "bundle:"
    labels: ["BundleOffer", "CorporateMetaBundle"]
    properties:
      code: { type: "string", unique: true, required: true }
      name: { type: "string", required: true }
      target_recipients: { type: "integer", required: true }
      total_price: { type: "number", required: true }
      description: { type: "string" }
      tier_breakdown: { type: "map" }

  GiftTier:
    prefix: "tier:"
    labels: ["GiftTier"]
    properties:
      name: { type: "enum", values: ["Reach", "Select", "Signature", "Bespoke"] }
      budget_tier: { type: "string" }
      priority: { type: "integer" }

  RecipientSegment:
    prefix: "seg:"
    labels: ["RecipientSegment"]
    properties:
      name: { type: "string", required: true }
      target_level: { type: "enum", values: ["C-Level", "Mid-Management", "Operations"] }

  CorporateClient:
    prefix: "client:"
    labels: ["CorporateClient"]
    properties:
      client_id: { type: "string", unique: true, required: true }
      name: { type: "string", required: true }
      industry: { type: "string" }
      segment: { type: "string" }
      tier_breakdown: { type: "map", required: true }

# 3. Edge Ontology (Graph Relationships)
edge_ontology:
  IN_CATEGORY:
    source: "ProductMaster"
    target: "Category"

  VARIANT_OF:
    source: "SKU"
    target: "ProductMaster"

  CONTAINS:
    source: "CatalogOffer"
    target: "ProductMaster"
    properties:
      qty: { type: "integer", default: 1, required: true }

  BELONGS_TO_TIER:
    source: "CatalogOffer"
    target: "GiftTier"

  RECOMMENDED_TIER:
    source: "RecipientSegment"
    target: "GiftTier"

  INCLUDES_OFFER:
    source: "BundleOffer"
    target: "CatalogOffer"
    properties:
      qty: { type: "integer", required: true }

  ORDERED:
    source: "CorporateClient"
    target: "BundleOffer"
    properties:
      order_id: { type: "string", required: true }
      quantity: { type: "integer", required: true }
      amount: { type: "number", required: true }
      ordered_at: { type: "timestamp" }

# 4. Standard HQL (Hybrid Query Language) Contracts
hql_contracts:
  set_decomposition: |
    TRAVERSE FROM "offer:{offer_code}" DEPTH 1 REL CONTAINS

  bundle_cascade: |
    TRAVERSE FROM "bundle:{bundle_code}" DEPTH 2 REL INCLUDES_OFFER|CONTAINS

  unboxing_semantic_search: |
    SEARCH IN unboxing_sensory FOR "{query_text}" K 5

  tiered_context_expansion: |
    CONTEXT FOR "offer:{offer_code}" TIER H2 BUDGET 2048

# ADR-007 approved 2026-08-31. Isolated registry contract; catalog v1.3.0 unchanged.
registry_contract:
  schema_ref: "smartgift://knowledge/registry/v1"
  version: "0.1.0b"
  vault_id: "vlt-knowledge-registry"
  tenant_id: "Org-EtohGroup"
  business_id: "SmartGift"
  classification: "product_metadata"
  access_scope_ref: "smartgift:internal:product-metadata"
  id_format: "typed-prefix:UUIDv7"
  writer_authority: "immutable-ledger-generations"
  graph_role: "rebuildable-projection-no-independent-writes"
  embeddings_enabled: false
  common_required: [id, type, tenant_id, business_id, classification, access_scope_ref, registry_contract_version, registered_at, updated_at, lifecycle_status, props]
  query_limits: {default_depth: 4, max_depth: 6, max_nodes: 500, max_edges: 1000, page_size: 100, time_budget_ms: 1000}
  unique_keys: [scoped_id, origin_identity, asset_sha256, attachment_binding, source_locator]

registry_node_ontology:
  Document:
    prefix: "doc:"
    required_properties: [origin_key, visual_origin, usage_rights, identity_status]
  Picture:
    prefix: "pic:"
    required_properties: [origin_key, visual_origin, usage_rights, identity_status]
  Media:
    prefix: "media:"
    required_properties: [origin_key, visual_origin, usage_rights, identity_status]
  Attachment:
    prefix: "att:"
    required_properties: [owner_version_id, target_version_id, locator, role]
  AssetVersion:
    prefix: "ver:"
    required_properties: [owner_asset_id, sha256, size_bytes, detected_mime, ordinal]
  FileLocation:
    prefix: "loc:"
    required_properties: [path, storage_scope]
  EvidenceRecord:
    prefix: "ev:"
    required_properties: [source_version_id, source_sha256, locator, record_kind, locator_status]
  ProcessingRun:
    prefix: "run:"
    required_properties: [operation, implementation, configuration_sha256, started_at, finished_at, status]
  CatalogEntityReference:
    prefix: "eref:"
    required_properties: [target_entity_type, target_vault_id, canonical_id, business_code, resolution_status, authority_schema_hash]

registry_edge_ontology:
  HAS_VERSION: {from: [Document, Picture, Media], to: [AssetVersion]}
  STORED_AT: {from: [AssetVersion], to: [FileLocation]}
  HAS_ATTACHMENT: {from: [AssetVersion], to: [Attachment]}
  ATTACHES_VERSION: {from: [Attachment], to: [AssetVersion]}
  GENERATED_BY: {from: [AssetVersion, EvidenceRecord], to: [ProcessingRun]}
  USED_INPUT: {from: [ProcessingRun], to: [AssetVersion]}
  DERIVED_FROM: {from: [AssetVersion], to: [AssetVersion], acyclic: true}
  EXTRACTED_FROM: {from: [EvidenceRecord], to: [AssetVersion]}
  DEPENDS_ON: {from: [EvidenceRecord], to: [EvidenceRecord], acyclic: true}
  ABOUT_ENTITY: {from: [EvidenceRecord], to: [CatalogEntityReference]}
  ILLUSTRATES: {from: [AssetVersion], to: [CatalogEntityReference], verified_only: true}
