<!doctype html>
<html lang="en"><meta charset="utf-8"><title>SmartGift local GLB render worker</title>
<style>body{margin:0;background:#eae9e6}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { makeModel, inspectModel, geometryFingerprint, applyVariant } from '/models.mjs';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1200, 1200);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#eae9e6');
const pmrem = new THREE.PMREMGenerator(renderer);
const environment = new RoomEnvironment();
scene.environment = pmrem.fromScene(environment, 0.04).texture;
environment.dispose();
scene.add(new THREE.HemisphereLight('#ffffff', '#9f9c92', 0.7));
const key = new THREE.DirectionalLight('#ffffff', 2);
key.position.set(-0.15, 0.25, 0.23); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left:-0.16, right:0.16, top:0.18, bottom:-0.16, near:0.01, far:1 });
key.shadow.bias = -0.00008; key.shadow.normalBias = 0.00035;
scene.add(key);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2,2), new THREE.ShadowMaterial({ opacity:0.12 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.0008; ground.receiveShadow = true; scene.add(ground);
const camera = new THREE.PerspectiveCamera(29, 1, 0.001, 5);
let current;
const base64 = bytes => { let str=''; for(let i=0;i<bytes.length;i+=8192) str+=String.fromCharCode(...bytes.subarray(i,i+8192)); return btoa(str); };

async function load(buffer) {
  if(current) { scene.remove(current); current.traverse(n=>{if(n.isMesh){n.geometry.dispose();n.material.dispose();}}); }
  current = (await new GLTFLoader().parseAsync(buffer, '')).scene;
  current.traverse(n=>{ if(n.isMesh) { n.castShadow=true; n.receiveShadow=true; } });
  scene.add(current);
  return inspectModel(current);
}

window.worker = {
  async exportModel(code, recipe) {
    const model = makeModel(code, recipe);
    const metrics = inspectModel(model);
    const geometry = geometryFingerprint(model);
    const binary = await new GLTFExporter().parseAsync(model, { binary:true });
    const imported = await load(binary);
    return { glb:base64(new Uint8Array(binary)), geometry, metrics, imported };
  },
  async loadFile(url) {
    const response = await fetch(url);
    if(!response.ok) throw Error('GLB reload failed');
    return load(await response.arrayBuffer());
  },
  capture(view='front', variant=null) {
    if(variant) applyVariant(current, variant);
    const bounds = new THREE.Box3().setFromObject(current);
    const center = bounds.getCenter(new THREE.Vector3());
    const size = bounds.getSize(new THREE.Vector3());
    const distance = Math.max(size.x,size.y)*3.5;
    const vectors = { front:[0.65,0.3,1], back:[-0.65,0.3,-1], side:[1,0.18,0.04], straight:[0,0.01,1] };
    camera.position.copy(center).add(new THREE.Vector3(...vectors[view]).normalize().multiplyScalar(distance));
    camera.lookAt(center); camera.updateProjectionMatrix();
    renderer.render(scene,camera);
    const gl = renderer.getContext(), pixels = new Uint8Array(1200*1200*4);
    gl.readPixels(0,0,1200,1200,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
    let visible=0;
    for(let i=0;i<pixels.length;i+=4) if(Math.abs(pixels[i]-pixels[0])+Math.abs(pixels[i+1]-pixels[1])+Math.abs(pixels[i+2]-pixels[2])>45) visible++;
    return { png:renderer.domElement.toDataURL('image/png').split(',')[1], visible_pixels:visible, metrics:inspectModel(current) };
  },
};
window.ready = true;
</script></html>
